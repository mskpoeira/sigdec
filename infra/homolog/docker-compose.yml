name: sigdec-homolog

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: sigdec-postgres-homolog
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [sigdec]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: sigdec-redis-homolog
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks: [sigdec]

  minio:
    image: quay.io/minio/minio:latest
    container_name: sigdec-minio-homolog
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    networks: [sigdec]

  minio-init:
    image: quay.io/minio/mc:latest
    container_name: sigdec-minio-init-homolog
    restart: "no"
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      SIDEC_WORM_BUCKET: ${SIDEC_WORM_BUCKET:-sigdec-worm-v1}
      SIDEC_WORM_REPLICA_BUCKET: ${SIDEC_WORM_REPLICA_BUCKET:-sigdec-worm-replica-v1}
    entrypoint: ["/bin/sh","-c"]
    command:
      - >
        until mc alias set sigdec http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do sleep 2; done;
        mc mb --ignore-existing --with-lock "sigdec/${SIDEC_WORM_BUCKET:-sigdec-worm-v1}";
        mc mb --ignore-existing --with-lock "sigdec/${SIDEC_WORM_REPLICA_BUCKET:-sigdec-worm-replica-v1}";
        mc version info "sigdec/${SIDEC_WORM_BUCKET:-sigdec-worm-v1}";
        mc version info "sigdec/${SIDEC_WORM_REPLICA_BUCKET:-sigdec-worm-replica-v1}";
    networks: [sigdec]

  api:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    container_name: sigdec-api-homolog
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 4000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      SIDEC_WORM_BUCKET: ${SIDEC_WORM_BUCKET:-sigdec-worm-v1}
      SIDEC_WORM_MODE: ${SIDEC_WORM_MODE:-GOVERNANCE}
      SIDEC_WORM_VERIFICATION_MINUTES: ${SIDEC_WORM_VERIFICATION_MINUTES:-1440}
      SIDEC_WORM_STALE_HOURS: ${SIDEC_WORM_STALE_HOURS:-48}
      SIDEC_WORM_REPLICA_ENABLED: ${SIDEC_WORM_REPLICA_ENABLED:-true}
      SIDEC_WORM_REPLICA_ENDPOINT: ${SIDEC_WORM_REPLICA_ENDPOINT:-http://minio:9000}
      SIDEC_WORM_REPLICA_BUCKET: ${SIDEC_WORM_REPLICA_BUCKET:-sigdec-worm-replica-v1}
      SIDEC_WORM_REPLICA_MODE: ${SIDEC_WORM_REPLICA_MODE:-GOVERNANCE}
      JWT_SECRET: ${JWT_SECRET}
      SESSION_HOURS: ${SESSION_HOURS}
      SIGDEC_PUBLIC_URL: https://${SIGDEC_DOMAIN}
      SIGDEC_ORG_NAME: ${SIGDEC_ORG_NAME}
      SIGDEC_ORG_SLUG: ${SIGDEC_ORG_SLUG}
      SIGDEC_MASTER_MATRICULA: ${SIGDEC_MASTER_MATRICULA}
      SIGDEC_MASTER_NAME: ${SIGDEC_MASTER_NAME}
      SIGDEC_MASTER_EMAIL: ${SIGDEC_MASTER_EMAIL}
      SIGDEC_MASTER_PHONE: ${SIGDEC_MASTER_PHONE}
      SIGDEC_MASTER_JOB_TITLE: ${SIGDEC_MASTER_JOB_TITLE}
      SIGDEC_MASTER_DEPARTMENT: ${SIGDEC_MASTER_DEPARTMENT}
      SIGDEC_MASTER_PASSWORD: ${SIGDEC_MASTER_PASSWORD}
      PASSWORD_RESET_MINUTES: ${PASSWORD_RESET_MINUTES:-30}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SIGDEC_MAIL_FROM: ${SIGDEC_MAIL_FROM:-}
      MIGRATIONS_DIR: /app/db/migrations
    networks:
      - sigdec
      - edge

  web:
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
      args:
        NEXT_PUBLIC_SIGDEC_API_URL: https://${SIGDEC_DOMAIN}
    container_name: sigdec-web-homolog
    restart: unless-stopped
    depends_on: [api]
    networks:
      - sigdec
      - edge

networks:
  sigdec:
  edge:
    external: true
    name: sgr_default

volumes:
  postgres_data:
  redis_data:
  minio_data:
