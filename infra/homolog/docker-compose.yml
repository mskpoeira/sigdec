name: sigdec-homolog

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: sigdec-postgres-homolog
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [sigdec]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: sigdec-redis-homolog
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks: [sigdec]

  minio:
    image: quay.io/minio/minio:latest
    container_name: sigdec-minio-homolog
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    networks: [sigdec]

  minio-init:
    image: quay.io/minio/mc:latest
    container_name: sigdec-minio-init-homolog
    restart: "no"
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET:-sigdec}
      SIDEC_WORM_BUCKET: ${SIDEC_WORM_BUCKET:-sigdec-worm-v1}
      SIDEC_WORM_REPLICA_BUCKET: ${SIDEC_WORM_REPLICA_BUCKET:-sigdec-worm-replica-v1}
    entrypoint: ["/bin/sh","-c"]
    command:
      - >
        until mc alias set sigdec http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do sleep 2; done;
        mc mb --ignore-existing "sigdec/${S3_BUCKET:-sigdec}";
        mc mb --ignore-existing --with-lock "sigdec/${SIDEC_WORM_BUCKET:-sigdec-worm-v1}";
        mc mb --ignore-existing --with-lock "sigdec/${SIDEC_WORM_REPLICA_BUCKET:-sigdec-worm-replica-v1}";
        mc version info "sigdec/${SIDEC_WORM_BUCKET:-sigdec-worm-v1}";
        mc version info "sigdec/${SIDEC_WORM_REPLICA_BUCKET:-sigdec-worm-replica-v1}";
    networks: [sigdec]

  api:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    container_name: sigdec-api-homolog
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 4000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      SIDEC_WORM_BUCKET: ${SIDEC_WORM_BUCKET:-sigdec-worm-v1}
      SIDEC_WORM_MODE: ${SIDEC_WORM_MODE:-GOVERNANCE}
      SIDEC_WORM_VERIFICATION_MINUTES: ${SIDEC_WORM_VERIFICATION_MINUTES:-1440}
      SIDEC_RESILIENCE_EVALUATION_MINUTES: ${SIDEC_RESILIENCE_EVALUATION_MINUTES:-15}
      SIDEC_REPLICA_RETRY_BASE_MINUTES: ${SIDEC_REPLICA_RETRY_BASE_MINUTES:-15}
      SIDEC_REPLICA_RETRY_MAX_MINUTES: ${SIDEC_REPLICA_RETRY_MAX_MINUTES:-1440}
      SIDEC_RESILIENCE_ALERT_AFTER_HOURS: ${SIDEC_RESILIENCE_ALERT_AFTER_HOURS:-6}
      SIDEC_RESTORE_DRILL_HOURS: ${SIDEC_RESTORE_DRILL_HOURS:-168}
      SIDEC_CONTINUITY_ACTION_DUE_SOON_HOURS: ${SIDEC_CONTINUITY_ACTION_DUE_SOON_HOURS:-72}
      SIDEC_CONTINUITY_ACTION_ALERT_MINUTES: ${SIDEC_CONTINUITY_ACTION_ALERT_MINUTES:-60}
      SIDEC_WORM_STALE_HOURS: ${SIDEC_WORM_STALE_HOURS:-48}
      SIDEC_WORM_REPLICA_ENABLED: ${SIDEC_WORM_REPLICA_ENABLED:-true}
      SIDEC_WORM_REPLICA_ENDPOINT: ${SIDEC_WORM_REPLICA_ENDPOINT:-http://minio:9000}
      SIDEC_WORM_REPLICA_BUCKET: ${SIDEC_WORM_REPLICA_BUCKET:-sigdec-worm-replica-v1}
      SIDEC_WORM_REPLICA_MODE: ${SIDEC_WORM_REPLICA_MODE:-GOVERNANCE}
      AUDIT_ED25519_PRIVATE_SEED_BASE64: ${AUDIT_ED25519_PRIVATE_SEED_BASE64:-}
      AUDIT_ED25519_KEY_ID: ${AUDIT_ED25519_KEY_ID:-audit-derived-v1}
      JWT_SECRET: ${JWT_SECRET}
      SESSION_HOURS: ${SESSION_HOURS}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:-}
      MFA_MODE: disabled
      MFA_STRATEGIC_ROLE_LEVEL: ${MFA_STRATEGIC_ROLE_LEVEL:-80}
      MFA_TRUSTED_DEVICE_DAYS: ${MFA_TRUSTED_DEVICE_DAYS:-30}
      WEBHOOK_DISPATCH_SECONDS: ${WEBHOOK_DISPATCH_SECONDS:-30}
      SIGDEC_AI_ENABLED: ${SIGDEC_AI_ENABLED:-true}
      SIGDEC_AI_PROVIDER_ORDER: ${SIGDEC_AI_PROVIDER_ORDER:-OPENAI,GEMINI,GROQ,OLLAMA}
      SIGDEC_AI_CONTEXT_PROVIDER_ORDER: ${SIGDEC_AI_CONTEXT_PROVIDER_ORDER:-GROQ,GEMINI,OPENAI,OLLAMA}
      SIGDEC_AI_REPORT_PROVIDER_ORDER: ${SIGDEC_AI_REPORT_PROVIDER_ORDER:-OPENAI,GEMINI,OLLAMA,GROQ}
      SIGDEC_AI_MODEL: ${SIGDEC_AI_MODEL:-gpt-5.6-luna}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SIGDEC_GEMINI_MODEL: ${SIGDEC_GEMINI_MODEL:-gemini-3.5-flash-lite}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      SIGDEC_GROQ_MODEL: ${SIGDEC_GROQ_MODEL:-openai/gpt-oss-20b}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      SIGDEC_OLLAMA_URL: ${SIGDEC_OLLAMA_URL:-}
      SIGDEC_OLLAMA_MODEL: ${SIGDEC_OLLAMA_MODEL:-gpt-oss:20b}
      GEOPIXEL_ALLOW_PRIVATE_NETWORK: ${GEOPIXEL_ALLOW_PRIVATE_NETWORK:-false}
      GEOPIXEL_SYNC_EVALUATION_MINUTES: ${GEOPIXEL_SYNC_EVALUATION_MINUTES:-10}
      GEOPIXEL_EXPORT_DISPATCH_SECONDS: ${GEOPIXEL_EXPORT_DISPATCH_SECONDS:-30}
      SEI_ALLOW_PRIVATE_NETWORK: ${SEI_ALLOW_PRIVATE_NETWORK:-false}
      SIGDEC_PUBLIC_URL: https://${SIGDEC_DOMAIN}
      SIGDEC_ORG_NAME: ${SIGDEC_ORG_NAME}
      SIGDEC_ORG_SLUG: ${SIGDEC_ORG_SLUG}
      SIGDEC_MASTER_MATRICULA: ${SIGDEC_MASTER_MATRICULA}
      SIGDEC_MASTER_NAME: ${SIGDEC_MASTER_NAME}
      SIGDEC_MASTER_EMAIL: ${SIGDEC_MASTER_EMAIL}
      SIGDEC_MASTER_PHONE: ${SIGDEC_MASTER_PHONE}
      SIGDEC_MASTER_JOB_TITLE: ${SIGDEC_MASTER_JOB_TITLE}
      SIGDEC_MASTER_DEPARTMENT: ${SIGDEC_MASTER_DEPARTMENT}
      SIGDEC_MASTER_PASSWORD: ${SIGDEC_MASTER_PASSWORD}
      PASSWORD_RESET_MINUTES: ${PASSWORD_RESET_MINUTES:-30}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SIGDEC_MAIL_FROM: ${SIGDEC_MAIL_FROM:-}
      INSTITUTIONAL_WEBMAIL_URL: ${INSTITUTIONAL_WEBMAIL_URL:-https://webmail.ubatuba.sp.gov.br/}
      INSTITUTIONAL_MAILBOX_LABEL: ${INSTITUTIONAL_MAILBOX_LABEL:-Webmail da Prefeitura de Ubatuba}
      INSTITUTIONAL_SMTP_HOST: ${INSTITUTIONAL_SMTP_HOST:-mail.ubatuba.sp.gov.br}
      INSTITUTIONAL_SMTP_PORT: ${INSTITUTIONAL_SMTP_PORT:-465}
      INSTITUTIONAL_SMTP_SECURE: ${INSTITUTIONAL_SMTP_SECURE:-true}
      INSTITUTIONAL_IMAP_HOST: ${INSTITUTIONAL_IMAP_HOST:-mail.ubatuba.sp.gov.br}
      INSTITUTIONAL_IMAP_PORT: ${INSTITUTIONAL_IMAP_PORT:-993}
      INSTITUTIONAL_IMAP_SECURE: ${INSTITUTIONAL_IMAP_SECURE:-true}
      INSTITUTIONAL_MAIL_USER: ${INSTITUTIONAL_MAIL_USER:-}
      INSTITUTIONAL_MAIL_PASSWORD: ${INSTITUTIONAL_MAIL_PASSWORD:-}
      INSTITUTIONAL_MAIL_FROM: ${INSTITUTIONAL_MAIL_FROM:-}
      MIGRATIONS_DIR: /app/db/migrations
    networks:
      - sigdec

  web:
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
      args:
        NEXT_PUBLIC_SIGDEC_API_URL: https://${SIGDEC_DOMAIN}
    container_name: sigdec-web-homolog
    restart: unless-stopped
    depends_on: [api]
    networks:
      - sigdec


  caddy:
    image: caddy:2.10.2-alpine
    container_name: sigdec-caddy-homolog
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SIGDEC_HTTP_PORT:-28080}:80"
      - "127.0.0.1:${SIGDEC_HTTPS_PORT:-28443}:443"
    environment:
      SIGDEC_DOMAIN: ${SIGDEC_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [sigdec]
    depends_on:
      - api
      - web

networks:
  sigdec:
    name: sigdec-homolog
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
  caddy_data:
  caddy_config:
