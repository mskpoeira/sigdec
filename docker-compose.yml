services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: sigdec
      POSTGRES_USER: sigdec
      POSTGRES_PASSWORD: sigdec
    ports: ["5432:5432"]
    volumes: [sigdec_postgres:/var/lib/postgresql/data]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: [sigdec_redis:/data]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: sigdec
      MINIO_ROOT_PASSWORD: change-me-now
    ports: ["9000:9000", "9001:9001"]
    volumes: [sigdec_minio:/data]

volumes:
  sigdec_postgres:
  sigdec_redis:
  sigdec_minio:
