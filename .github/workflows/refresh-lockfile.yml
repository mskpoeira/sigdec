name: Refresh SIGDEC Lockfile

on:
  push:
    branches: ["fix/sigdec-v1.38.1-final-audit"]

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: fix/sigdec-v1.38.1-final-audit
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: pnpm
      - name: Regenerar lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commitar lockfile atualizado
        shell: bash
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile já está sincronizado."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: sincronizar pnpm-lock.yaml"
          git push origin HEAD:fix/sigdec-v1.38.1-final-audit
