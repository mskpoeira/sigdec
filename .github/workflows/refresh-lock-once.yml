name: Refresh lockfile once

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  refresh:
    if: github.repository == 'mskpoeira/sigdec'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          package-manager-cache: false
      - run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit refreshed lockfile and remove one-off workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git rm .github/workflows/refresh-lock-once.yml
          if git diff --cached --quiet; then
            echo "No lockfile changes."
            exit 0
          fi
          git commit -m "chore: refresh lockfile after security updates"
          git push origin HEAD:main
