name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: sigdec_ci
          POSTGRES_USER: sigdec
          POSTGRES_PASSWORD: sigdec_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sigdec -d sigdec_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://sigdec:sigdec_ci_password@localhost:5432/sigdec_ci
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @sigdec/api db:migrate
      - run: pnpm --filter @sigdec/api test:integration
      - run: pnpm build
