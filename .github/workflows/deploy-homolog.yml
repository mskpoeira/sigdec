name: Deploy Homologacao

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: sigdec-homolog
  cancel-in-progress: false

jobs:
  deploy:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    environment: homologacao

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Validar configuracao
        shell: bash
        env:
          SSH_HOST: ${{ secrets.HOMOLOG_SSH_HOST }}
          SSH_USER: ${{ secrets.HOMOLOG_SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.HOMOLOG_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.HOMOLOG_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_HOST" || { echo "HOMOLOG_SSH_HOST ausente"; exit 1; }
          test -n "$SSH_USER" || { echo "HOMOLOG_SSH_USER ausente"; exit 1; }
          test -n "$SSH_PRIVATE_KEY" || { echo "HOMOLOG_SSH_PRIVATE_KEY ausente"; exit 1; }
          test -n "$SSH_KNOWN_HOSTS" || { echo "HOMOLOG_SSH_KNOWN_HOSTS ausente"; exit 1; }

      - name: Configurar SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HOMOLOG_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.HOMOLOG_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" | tr -d '\r' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/id_ed25519" >/dev/null

      - name: Atualizar e implantar SIGDEC
        shell: bash
        env:
          SSH_HOST: ${{ secrets.HOMOLOG_SSH_HOST }}
          SSH_USER: ${{ secrets.HOMOLOG_SSH_USER }}
          SSH_PORT: ${{ secrets.HOMOLOG_SSH_PORT }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Commit de deploy inválido"; exit 1; }
          PORT="${SSH_PORT:-22}"
          ssh -p "$PORT" \
            -i "$HOME/.ssh/id_ed25519" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$SSH_USER@$SSH_HOST" bash -s -- "$DEPLOY_SHA" <<'REMOTE'
              set -euo pipefail
              cd /opt/sigdec
              git fetch --prune origin
              if [[ "$(git rev-parse origin/main)" != "$1" ]]; then
                echo "O main mudou após o CI; aguardando o deploy do commit mais recente."
                exit 1
              fi
              git checkout main
              git reset --hard "$1"
              chmod +x infra/homolog/deploy.sh
              infra/homolog/deploy.sh
          REMOTE

      - name: Verificar aplicacao
        shell: bash
        env:
          SIGDEC_URL: ${{ vars.HOMOLOG_PUBLIC_URL }}
        run: |
          set -euo pipefail
          test -n "$SIGDEC_URL" || { echo "HOMOLOG_PUBLIC_URL ausente"; exit 1; }
          EXPECTED_VERSION="$(node -p 'require("./package.json").version')"
          for i in {1..20}; do
            if body="$(curl --fail --silent --max-time 10 "$SIGDEC_URL/api/v1/ready")"; then
              if READY_JSON="$body" EXPECTED_VERSION="$EXPECTED_VERSION" node -e '
                const data=JSON.parse(process.env.READY_JSON);
                process.exit(data.status==="ready" && data.version===process.env.EXPECTED_VERSION ? 0 : 1);
              '; then
                echo "SIGDEC pronto com banco acessível na versão $EXPECTED_VERSION."
                exit 0
              fi
            fi
            sleep 5
          done
          echo "Falha no readiness check da versão $EXPECTED_VERSION."
          exit 1
