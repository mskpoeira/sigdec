name: Deploy Homologacao

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: sigdec-homolog
  cancel-in-progress: false

jobs:
  deploy:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    environment: homologacao

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Validar configuracao
        shell: bash
        env:
          SSH_HOST: ${{ secrets.HOMOLOG_SSH_HOST }}
          SSH_USER: ${{ secrets.HOMOLOG_SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.HOMOLOG_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.HOMOLOG_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_HOST" || { echo "HOMOLOG_SSH_HOST ausente"; exit 1; }
          test -n "$SSH_USER" || { echo "HOMOLOG_SSH_USER ausente"; exit 1; }
          test -n "$SSH_PRIVATE_KEY" || { echo "HOMOLOG_SSH_PRIVATE_KEY ausente"; exit 1; }
          test -n "$SSH_KNOWN_HOSTS" || { echo "HOMOLOG_SSH_KNOWN_HOSTS ausente"; exit 1; }

      - name: Configurar SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HOMOLOG_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.HOMOLOG_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" | tr -d '\r' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/id_ed25519" >/dev/null

      - name: Atualizar e implantar SIGDEC
        shell: bash
        env:
          SSH_HOST: ${{ secrets.HOMOLOG_SSH_HOST }}
          SSH_USER: ${{ secrets.HOMOLOG_SSH_USER }}
          SSH_PORT: ${{ secrets.HOMOLOG_SSH_PORT }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Commit de deploy inválido"; exit 1; }
          PORT="${SSH_PORT:-22}"
          ssh -p "$PORT" \
            -i "$HOME/.ssh/id_ed25519" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$SSH_USER@$SSH_HOST" bash -s -- "$DEPLOY_SHA" <<'REMOTE'
              set -euo pipefail
              cd /opt/sigdec
              git fetch --prune origin
              if [[ "$(git rev-parse origin/main)" != "$1" ]]; then
                echo "O main mudou após o CI; aguardando o deploy do commit mais recente."
                exit 1
              fi
              git checkout main
              git reset --hard "$1"
              chmod +x infra/homolog/deploy.sh
              infra/homolog/deploy.sh
          REMOTE

      - name: Limpar ocorrencias e despachos de homologacao
        shell: bash
        env:
          SSH_HOST: ${{ secrets.HOMOLOG_SSH_HOST }}
          SSH_USER: ${{ secrets.HOMOLOG_SSH_USER }}
          SSH_PORT: ${{ secrets.HOMOLOG_SSH_PORT }}
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          ssh -p "$PORT" \
            -i "$HOME/.ssh/id_ed25519" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$SSH_USER@$SSH_HOST" bash -s <<'REMOTE'
              set -euo pipefail
              cd /opt/sigdec/infra/homolog
              set -a
              source .env
              set +a
              docker compose --env-file .env exec -T postgres \
                psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" <<'SQL'
              BEGIN;

              CREATE TABLE IF NOT EXISTS maintenance_runs (
                maintenance_key text PRIMARY KEY,
                executed_at timestamptz NOT NULL DEFAULT now(),
                details jsonb NOT NULL DEFAULT '{}'::jsonb
              );

              DO $$
              DECLARE
                target_org uuid;
                fk record;
                deleted_incidents integer := 0;
                deleted_dispatches integer := 0;
                deleted_counters integer := 0;
                released_teams integer := 0;
                released_vehicles integer := 0;
              BEGIN
                IF EXISTS (
                  SELECT 1 FROM maintenance_runs
                  WHERE maintenance_key='homolog_reset_incidents_dispatches_20260927_02'
                ) THEN
                  RAISE NOTICE 'Limpeza de ocorrencias/despachos ja executada; nada a fazer.';
                  RETURN;
                END IF;

                SELECT organization_id INTO target_org
                FROM users
                WHERE regexp_replace(matricula,'[^0-9]','','g')='915789'
                ORDER BY created_at ASC
                LIMIT 1;

                IF target_org IS NULL THEN
                  RAISE EXCEPTION 'Organizacao do Master 915789 nao localizada.';
                END IF;

                SELECT count(*)::int INTO deleted_dispatches
                FROM dispatches d
                JOIN incidents i ON i.id=d.incident_id
                WHERE i.organization_id=target_org;

                -- Preserva dados auxiliares quando o FK para incidents e anulavel.
                -- Se houver FK RESTRICT/NO ACTION nao anulavel, remove somente o filho
                -- pertencente as ocorrencias que serao apagadas.
                FOR fk IN
                  SELECT ns.nspname AS schema_name,
                         cls.relname AS table_name,
                         att.attname AS column_name,
                         att.attnotnull,
                         con.confdeltype
                  FROM pg_constraint con
                  JOIN pg_class cls ON cls.oid=con.conrelid
                  JOIN pg_namespace ns ON ns.oid=cls.relnamespace
                  JOIN LATERAL unnest(con.conkey) WITH ORDINALITY k(attnum,ord) ON true
                  JOIN pg_attribute att ON att.attrelid=con.conrelid AND att.attnum=k.attnum
                  WHERE con.contype='f'
                    AND con.confrelid='public.incidents'::regclass
                    AND array_length(con.conkey,1)=1
                LOOP
                  -- c=CASCADE, n=SET NULL, d=SET DEFAULT: o DELETE principal resolve.
                  IF fk.confdeltype IN ('c','n','d') THEN
                    CONTINUE;
                  END IF;

                  IF fk.attnotnull THEN
                    EXECUTE format(
                      'DELETE FROM %I.%I WHERE %I IN (SELECT id FROM public.incidents WHERE organization_id=$1)',
                      fk.schema_name,fk.table_name,fk.column_name
                    ) USING target_org;
                  ELSE
                    EXECUTE format(
                      'UPDATE %I.%I SET %I=NULL WHERE %I IN (SELECT id FROM public.incidents WHERE organization_id=$1)',
                      fk.schema_name,fk.table_name,fk.column_name,fk.column_name
                    ) USING target_org;
                  END IF;
                END LOOP;

                DELETE FROM incidents WHERE organization_id=target_org;
                GET DIAGNOSTICS deleted_incidents = ROW_COUNT;

                DELETE FROM incident_counters WHERE organization_id=target_org;
                GET DIAGNOSTICS deleted_counters = ROW_COUNT;

                UPDATE teams
                   SET status='AVAILABLE', updated_at=now()
                 WHERE organization_id=target_org
                   AND status IN ('DISPATCHED','EN_ROUTE','ON_SCENE','RETURNING');
                GET DIAGNOSTICS released_teams = ROW_COUNT;

                UPDATE vehicles
                   SET status='AVAILABLE', updated_at=now()
                 WHERE organization_id=target_org
                   AND status IN ('DISPATCHED','EN_ROUTE','ON_SCENE','RETURNING');
                GET DIAGNOSTICS released_vehicles = ROW_COUNT;

                INSERT INTO maintenance_runs(maintenance_key,details)
                VALUES(
                  'homolog_reset_incidents_dispatches_20260927_02',
                  jsonb_build_object(
                    'organizationId',target_org,
                    'deletedIncidents',deleted_incidents,
                    'deletedDispatches',deleted_dispatches,
                    'deletedCounters',deleted_counters,
                    'releasedTeams',released_teams,
                    'releasedVehicles',released_vehicles,
                    'nextIncidentSequence',1,
                    'requestedAction','clear incidents and dispatches; reset incident numbering'
                  )
                );

                RAISE NOTICE 'Limpeza concluida: % ocorrencias, % despachos, % contadores.',
                  deleted_incidents,deleted_dispatches,deleted_counters;
              END
              $$;

              COMMIT;

              SELECT
                count(*) AS incidents_remaining
              FROM incidents i
              JOIN users u ON u.organization_id=i.organization_id
              WHERE regexp_replace(u.matricula,'[^0-9]','','g')='915789';

              SELECT
                count(*) AS dispatches_remaining
              FROM dispatches d
              JOIN incidents i ON i.id=d.incident_id
              JOIN users u ON u.organization_id=i.organization_id
              WHERE regexp_replace(u.matricula,'[^0-9]','','g')='915789';

              SELECT
                count(*) AS counters_remaining
              FROM incident_counters c
              JOIN users u ON u.organization_id=c.organization_id
              WHERE regexp_replace(u.matricula,'[^0-9]','','g')='915789';
              SQL
          REMOTE

      - name: Verificar aplicacao
        shell: bash
        env:
          SIGDEC_URL: ${{ vars.HOMOLOG_PUBLIC_URL }}
        run: |
          set -euo pipefail
          test -n "$SIGDEC_URL" || { echo "HOMOLOG_PUBLIC_URL ausente"; exit 1; }
          EXPECTED_VERSION="$(node -p 'require("./package.json").version')"
          for i in {1..20}; do
            if body="$(curl --fail --silent --max-time 10 "$SIGDEC_URL/api/v1/ready")"; then
              if READY_JSON="$body" EXPECTED_VERSION="$EXPECTED_VERSION" node -e '
                const data=JSON.parse(process.env.READY_JSON);
                process.exit(data.status==="ready" && data.version===process.env.EXPECTED_VERSION ? 0 : 1);
              '; then
                echo "SIGDEC pronto com banco acessível na versão $EXPECTED_VERSION."
                exit 0
              fi
            fi
            sleep 5
          done
          echo "Falha no readiness check da versão $EXPECTED_VERSION."
          exit 1
