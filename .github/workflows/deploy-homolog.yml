name: Deploy Homologacao

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: sigdec-homolog
  cancel-in-progress: false

jobs:
  deploy:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    environment: homologacao

    steps:
      - name: Validar configuracao
        shell: bash
        env:
          SSH_HOST: ${{ secrets.HOMOLOG_SSH_HOST }}
          SSH_USER: ${{ secrets.HOMOLOG_SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.HOMOLOG_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$SSH_HOST" || { echo "HOMOLOG_SSH_HOST ausente"; exit 1; }
          test -n "$SSH_USER" || { echo "HOMOLOG_SSH_USER ausente"; exit 1; }
          test -n "$SSH_PRIVATE_KEY" || { echo "HOMOLOG_SSH_PRIVATE_KEY ausente"; exit 1; }

      - name: Configurar SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HOMOLOG_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.HOMOLOG_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "HOMOLOG_SSH_KNOWN_HOSTS ausente; recusando conexao insegura."
            exit 1
          fi

      - name: Atualizar e implantar SIGDEC
        shell: bash
        env:
          SSH_HOST: ${{ secrets.HOMOLOG_SSH_HOST }}
          SSH_USER: ${{ secrets.HOMOLOG_SSH_USER }}
          SSH_PORT: ${{ secrets.HOMOLOG_SSH_PORT }}
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          ssh -p "$PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" '
            set -euo pipefail
            cd /opt/sigdec
            git fetch --prune origin
            git checkout main
            git reset --hard origin/main
            chmod +x infra/homolog/deploy.sh
            infra/homolog/deploy.sh
          '

      - name: Verificar aplicacao
        shell: bash
        env:
          SIGDEC_URL: ${{ secrets.HOMOLOG_PUBLIC_URL }}
        run: |
          set -euo pipefail
          test -n "$SIGDEC_URL" || { echo "HOMOLOG_PUBLIC_URL ausente"; exit 1; }
          for i in {1..20}; do
            if curl --fail --silent --show-error --max-time 10 "$SIGDEC_URL/health" >/dev/null; then
              echo "SIGDEC homologacao respondeu com sucesso."
              exit 0
            fi
            sleep 5
          done
          echo "Falha no healthcheck."
          exit 1
